<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Arsan Gaz · Tüp Takip</title>
<style>
:root { --accent:#b54a1f; --accent-dark:#8f3a18; --bg:#f5f5f4; --card:#fff; --line:#e7e5e4; --text:#1c1917; --muted:#78716c; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
header { background:var(--accent); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:5; flex-wrap:wrap; }
header h1 { font-size:18px; margin:0; font-weight:600; }
nav { display:flex; gap:4px; flex-wrap:wrap; }
nav button { background:transparent; color:#fff; border:1px solid transparent; border-radius:8px; padding:7px 12px; cursor:pointer; font-size:14px; }
nav button.active, nav button:hover { background:rgba(255,255,255,.18); }
header .spacer { flex:1; }
header .user { font-size:13px; opacity:.9; }
main { max-width:1200px; margin:0 auto; padding:18px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
.card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); margin:0 0 12px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; }
.stat:hover { border-color:var(--accent); }
.stat .n { font-size:28px; font-weight:700; color:var(--accent); }
.stat .l { font-weight:600; margin-top:2px; }
.stat .s { color:var(--muted); font-size:13px; margin-top:4px; }
.stat.warn .n { color:var(--warn); }
.filters { display:flex; flex-wrap:wrap; gap:8px; align-items:end; }
.filters label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:3px; }
input, select, textarea { font:inherit; padding:8px 10px; border:1px solid #d6d3d1; border-radius:8px; background:#fff; color:var(--text); min-width:0; }
input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
button.primary, button.secondary, a.secondary { font:inherit; border-radius:8px; padding:8px 14px; cursor:pointer; text-decoration:none; display:inline-block; }
button.primary { background:var(--accent); color:#fff; border:1px solid var(--accent); }
button.primary:hover { background:var(--accent-dark); }
button.secondary, a.secondary { background:#fff7f2; color:var(--accent); border:1px solid var(--accent); }
button:disabled { opacity:.5; cursor:default; }
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th { text-align:left; font-size:12px; color:var(--muted); font-weight:600; padding:8px; border-bottom:1px solid var(--line); white-space:nowrap; }
td { padding:8px; border-bottom:1px solid #f0efee; vertical-align:top; }
tr.click { cursor:pointer; }
tr.click:hover td { background:#fff7f2; }
.badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; background:#f5f5f4; border:1px solid var(--line); white-space:nowrap; }
.b1 { background:#ecfdf5; border-color:#a7f3d0; } .b2 { background:#eff6ff; border-color:#bfdbfe; } .b3 { background:#fff7ed; border-color:#fed7aa; }
.b4 { background:#f5f3ff; border-color:#ddd6fe; } .b5 { background:#fefce8; border-color:#fde68a; } .b6 { background:#fef2f2; border-color:#fecaca; }
.muted { color:var(--muted); font-size:13px; }
.warn-text { color:var(--warn); }
.bad-text { color:var(--bad); }
.hidden { display:none !important; }
#login { max-width:380px; margin:10vh auto; }
#login .card { padding:24px; }
#login h1 { color:var(--accent); font-size:20px; margin:0 0 4px; }
#login form { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
.msg { padding:10px 12px; border-radius:8px; margin:8px 0; white-space:pre-line; }
.msg.err { background:#fef2f2; color:var(--bad); border:1px solid #fecaca; }
.msg.ok { background:#f0fdf4; color:var(--ok); border:1px solid #bbf7d0; }
.msg.warn { background:#fffbeb; color:var(--warn); border:1px solid #fde68a; }
dialog { border:none; border-radius:16px; padding:0; width:min(900px,96vw); max-height:92vh; }
dialog::backdrop { background:rgba(0,0,0,.4); }
.dlg-head { display:flex; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; }
.dlg-head h3 { margin:0; flex:1; font-size:17px; }
.dlg-body { padding:16px 18px; overflow:auto; max-height:calc(92vh - 60px); }
.kv { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px 16px; }
.kv div span { display:block; font-size:12px; color:var(--muted); }
.form-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
.form-grid label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.hint { font-size:12px; color:var(--muted); margin-top:6px; }
@media (max-width:640px) { main { padding:10px; } header { padding:10px 12px; } .hide-sm { display:none; } }
</style>
</head>
<body>
<div id="login" class="hidden">
  <div class="card">
    <h1>Arsan Gaz · Tüp Takip</h1>
    <div class="muted">Yetkili kullanıcı girişi</div>
    <form id="login-form" autocomplete="on">
      <input id="login-user" name="username" autocomplete="username" placeholder="Kullanıcı adı" required maxlength="100">
      <input id="login-pass" name="password" type="password" autocomplete="current-password" placeholder="Şifre" required maxlength="200">
      <button class="primary" type="submit">Giriş yap</button>
      <div id="login-msg" class="msg err hidden"></div>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Arsan Gaz · Tüp Takip</h1>
    <nav>
      <button data-tab="ozet" class="active">Özet</button>
      <button data-tab="tupler">Tüpler</button>
      <button data-tab="hareketler">Hareketler</button>
      <button data-tab="yeni">Yeni tüp</button>
    </nav>
    <div class="spacer"></div>
    <span class="user" id="who"></span>
    <button class="secondary" id="logout" type="button">Çıkış</button>
  </header>
  <main>
    <div id="global-msg" class="msg hidden"></div>

    <section data-page="ozet">
      <div class="grid" id="stats"></div>
      <div class="card" style="margin-top:16px">
        <h2>Araçlardaki tüpler</h2>
        <div id="vehicles" class="grid"></div>
      </div>
      <div class="card">
        <h2>Son hareketler</h2>
        <div class="table-wrap"><table id="recent"></table></div>
      </div>
    </section>

    <section data-page="tupler" class="hidden">
      <div class="card">
        <div class="filters">
          <label>Ara<input id="f-q" placeholder="Seri no, barkod, gaz, müşteri, plaka"></label>
          <label>Durum<select id="f-durum"><option value="">Tümü</option></select></label>
          <label>Dolu/Boş<select id="f-doluluk"><option value="">Tümü</option><option value="dolu">Dolu</option><option value="bos">Boş</option><option value="bilinmiyor">Bilinmiyor</option></select></label>
          <label>Plaka<select id="f-plaka"><option value="">Tümü</option></select></label>
          <label><span><input type="checkbox" id="f-uzun"> Uzun süredir müşteride</span></label>
          <label><span><input type="checkbox" id="f-pasif"> Pasif tüpler</span></label>
          <button class="primary" id="f-ara" type="button">Listele</button>
        </div>
      </div>
      <div class="card">
        <div class="muted" id="cyl-count"></div>
        <div class="table-wrap"><table id="cylinders"></table></div>
      </div>
    </section>

    <section data-page="hareketler" class="hidden">
      <div class="card">
        <div class="filters">
          <label>Başlangıç<input type="date" id="h-bas"></label>
          <label>Bitiş<input type="date" id="h-bit"></label>
          <label>Yeni durum<select id="h-durum"><option value="">Tümü</option></select></label>
          <label>Müşteri<select id="h-musteri"><option value="">Tümü</option></select></label>
          <label>Ara<input id="h-q" placeholder="Seri no, müşteri, plaka, not"></label>
          <button class="primary" id="h-ara" type="button">Listele</button>
          <a class="secondary" id="h-csv" href="#">Excel'e aktar (CSV)</a>
        </div>
      </div>
      <div class="card">
        <div class="muted" id="mov-count"></div>
        <div class="table-wrap"><table id="movements"></table></div>
      </div>
    </section>

    <section data-page="yeni" class="hidden">
      <div class="card">
        <h2>Yeni tüp kaydı</h2>
        <form id="new-form" class="form-grid">
          <label>Seri numarası *<input id="n-serial" required maxlength="100"></label>
          <label>Barkod / QR (boşsa seri no)<input id="n-barcode" maxlength="100"></label>
          <label>Gaz türü *<input id="n-gas" list="gas-list" required maxlength="80"></label>
          <label>Kapasite *<input id="n-cap" inputmode="decimal" required placeholder="ör. 40"></label>
          <label>Birim<select id="n-unit"><option>Litre</option><option>kg</option><option>m³</option></select></label>
          <label>Dolu / boş<select id="n-full"><option value="">Bilinmiyor</option><option value="true">Dolu</option><option value="false">Boş</option></select></label>
          <label>Test tarihi<input type="date" id="n-test"></label>
          <div style="display:flex;align-items:end"><button class="primary" type="submit">Kaydet</button></div>
        </form>
        <div class="hint">Tüp "Depoda" olarak eklenir. Aynı seri no veya barkod ikinci kez kaydedilemez.</div>
        <div id="new-msg" class="msg hidden"></div>
      </div>
    </section>
  </main>
</div>

<datalist id="gas-list"></datalist>

<dialog id="detail">
  <div class="dlg-head"><h3 id="d-title">Tüp</h3><button class="secondary" id="d-close" type="button">Kapat</button></div>
  <div class="dlg-body">
    <div id="d-msg" class="msg hidden"></div>
    <div class="card"><h2>Bilgiler</h2><div class="kv" id="d-info"></div></div>
    <div class="card">
      <h2>Hareket kaydet</h2>
      <div class="form-grid">
        <label>Yeni durum<select id="m-status"></select></label>
        <label id="m-customer-wrap">Müşteri<input id="m-customer-q" placeholder="Müşteri ara"><select id="m-customer"></select></label>
        <label id="m-plate-wrap">Plaka<input id="m-plate" list="plate-list" placeholder="01 ABC 123"></label>
        <label>Dolu / boş<select id="m-full"><option value="">Otomatik</option><option value="true">Dolu</option><option value="false">Boş</option></select></label>
        <label>Not<input id="m-note" maxlength="300"></label>
      </div>
      <div class="actions"><button class="primary" id="m-save" type="button">Hareketi kaydet</button></div>
    </div>
    <div class="card">
      <h2>Tüp bilgilerini düzenle</h2>
      <div class="form-grid">
        <label>Gaz türü<input id="e-gas" list="gas-list" maxlength="80"></label>
        <label>Kapasite<input id="e-cap" inputmode="decimal"></label>
        <label>Birim<select id="e-unit"><option>Litre</option><option>kg</option><option>m³</option></select></label>
        <label>Test tarihi<input type="date" id="e-test"></label>
        <label>Kayıt durumu<select id="e-active"><option value="true">Aktif</option><option value="false">Pasif (kullanım dışı)</option></select></label>
      </div>
      <div class="actions"><button class="secondary" id="e-save" type="button">Bilgileri kaydet</button></div>
    </div>
    <div class="card"><h2>Hareket geçmişi</h2><div class="table-wrap"><table id="d-history"></table></div></div>
  </div>
</dialog>
<datalist id="plate-list"></datalist>

<script src="/panel/app.js"></script>
</body>
</html>
