# /etc/systemd/system/arsangaz-mobileapi.service.d/postgres.conf
# MobileApi sunucudaki PostgreSQL'i (arsangaz veritabanı, erp/crm şemaları) kullanır.
# Geri dönmek için bu dosyayı silip: systemctl daemon-reload && systemctl restart arsangaz-mobileapi
[Unit]
After=postgresql.service
Wants=postgresql.service

[Service]
# ARSANGAZ_PG_CONNECTION (0600, sahibi arsangaz; setup-postgres.sh oluşturur)
EnvironmentFile=/etc/arsangaz/postgres.env
Environment=ARSANGAZ_DB_PROVIDER=postgres
# Kampanya verisi ofis PC kullanıcısının Windows SID değeriyle saklanır; sunucu aynı sahibin verisini sunar.
# PC'de: [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
Environment=ARSANGAZ_OWNER_SID=<PC-KULLANICI-SID>
