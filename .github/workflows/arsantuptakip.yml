# ArsanTüpTakip (Tools/ArsanTupTakip) için ayrı derleme kontrolü. Mevcut CI (ci.yml) işlerinden bağımsızdır.
# APK yayınlanmaz ve imzalanmaz; mobil iş yalnızca projenin derlendiğini doğrular.
name: ArsanTupTakip
on:
  push:
    branches: [main, 'cursor/server-*', 'cursor/arsantuptakip-*']
    paths:
      - 'Tools/ArsanTupTakip/**'
      - '.github/workflows/arsantuptakip.yml'
  workflow_dispatch:
concurrency:
  group: arsantuptakip-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Tools/ArsanTupTakip
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: Tools/ArsanTupTakip/global.json
      - name: Derleme
        run: dotnet build ArsanTupTakip.slnx -c Release -nologo -clp:ErrorsOnly
      - name: Testler
        run: dotnet run --project tests/ArsanTupTakip.Tests/ArsanTupTakip.Tests.csproj -c Release --no-build
      - name: Panel betiği sözdizimi
        run: node --check src/ArsanTupTakip.Api/WebPanel/panel.js
      - name: Sunucu betikleri sözdizimi
        run: for f in deploy/*.sh deploy/arsantuptakip-backup deploy/arsantuptakip-release; do bash -n "$f"; done
      - name: Telegram botu ve ajan testleri
        run: |
          for f in bot/*.js; do node --check "$f"; done
          node --test bot/commands.test.js bot/queue.test.js bot/agent-rules.test.js
      - name: Yayın betiği benzetim testi
        run: bash deploy/test-release.sh

  mobile:
    name: mobil-derleme
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: Tools/ArsanTupTakip/global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: dotnet workload install maui-android
      - name: Android derleme (imzasız, yayın yok)
        run: |
          set -euo pipefail
          proj=Tools/ArsanTupTakip/mobile/ArsanTupTakip.Mobile/ArsanTupTakip.Mobile.csproj
          dotnet build "$proj" -t:InstallAndroidDependencies -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True -nologo -v q
          dotnet build "$proj" -c Debug -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -nologo -clp:ErrorsOnly
