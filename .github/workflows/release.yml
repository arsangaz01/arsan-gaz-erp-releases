name: Build and Release Arsan Gaz ERP
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore .\ArsanGazERP.csproj --force --no-cache
          dotnet build .\ArsanGazERP.csproj -c Release --no-restore
      - name: Publish ERP and AgentWatcher
        shell: pwsh
        run: |
          dotnet publish .\ArsanGazERP.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\artifacts\app
          dotnet publish .\Tools\AgentWatcher\ArsanGazERP.AgentWatcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\artifacts\app\AgentWatcher
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Setup.exe
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\Installer\ArsanGazERP.iss"'
      - name: Create update manifest
        shell: pwsh
        run: |
          $setup=Get-Item .\artifacts\installer\ArsanGazERP_Setup.exe
          $hash=(Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          @{version="${{ github.ref_name }}".TrimStart('v');url="https://github.com/arsangaz01/arsan-gaz-erp-releases/releases/download/${{ github.ref_name }}/ArsanGazERP_Setup.exe";sha256=$hash;mandatory=$false;publishedAt=(Get-Date).ToUniversalTime().ToString('o')} | ConvertTo-Json | Set-Content .\artifacts\installer\update.json -Encoding utf8
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArsanGazERP-Setup
          path: .\artifacts\installer\*
      # Source lives in the private repo; desktop auto-update reads releases from the public repo, so the release is
      # published there with a fine-grained token (Contents: read/write on arsan-gaz-erp-releases only).
      - name: Publish release to public releases repo
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASES_REPO: arsangaz01/arsan-gaz-erp-releases
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $env:GH_TOKEN) { throw "RELEASES_REPO_TOKEN secret is missing; the release cannot be published to $env:RELEASES_REPO." }
          gh release view $tag --repo $env:RELEASES_REPO *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists in $env:RELEASES_REPO; bump the version instead of re-publishing." }
          # Test tags (v*-test*) verify the pipeline: prerelease, never 'latest', no update.json, so clients ignore them.
          if ($tag -match '-test') {
            gh release create $tag .\artifacts\installer\ArsanGazERP_Setup.exe --repo $env:RELEASES_REPO --prerelease --latest=false --title "TEST $tag (silinecek)" --notes "Sürüm hattı testi; otomatik güncellemeyi etkilemez ve silinecektir."
          } else {
            gh release create $tag .\artifacts\installer\ArsanGazERP_Setup.exe .\artifacts\installer\update.json --repo $env:RELEASES_REPO --latest --title "Arsan Gaz ERP $tag" --notes "Arsan Gaz ERP $tag kurulum dosyası ve güncelleme bildirimi."
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed." }