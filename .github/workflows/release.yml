name: Build and Release Arsan Gaz ERP

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new release tag to build, for example v5.1.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ArsanGazERP.csproj -r win-x64

      - name: Build
        run: dotnet build ArsanGazERP.csproj -c Release --no-restore

      - name: Publish single-file application
        run: dotnet publish ArsanGazERP.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-restore -o publish

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: powershell
        run: |
          $version = ([xml](Get-Content ArsanGazERP.csproj)).Project.PropertyGroup.Version
          if (-not $version) { $version = "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "installer\ArsanGazERP.iss"

      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path publish\* -DestinationPath ArsanGazERP-portable-win-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArsanGazERP-win-x64
          path: |
            installer\Output\ArsanGazERPSetup.exe
            ArsanGazERP-portable-win-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $tag" }
          $setup = "installer\Output\ArsanGazERPSetup.exe"
          $portable = "ArsanGazERP-portable-win-x64.zip"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag --repo $env:GITHUB_REPOSITORY $setup $portable --clobber
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Arsan Gaz ERP $tag" --generate-notes $setup $portable
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish assets for $tag" }